name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史（可能影响 Gradle Wrapper）

    - name: Pre-Build Checks
      run: |
        echo "===== Essential Files Check ====="
        echo "Workspace: $(pwd)"
        echo "--- Directory Listing ---"
        ls -la
        echo "--- Gradle Wrapper ---"
        ls -l gradle* || echo "No gradle files found"
        echo "--- Build Files ---"
        ls -l build.gradle* settings.gradle* || echo "No build files found"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    # 改动 1：不再临时生成 wrapper。
    # Wrapper 应当提交到仓库，否则 CI 用的 Gradle 版本会与本地/生产不一致。
    # 原来的 fallback `gradle wrapper --gradle-version 8.5` 有两个问题：
    #   a) runner 上不一定有系统级 gradle 命令
    #   b) 8.5 与项目实际的 9.7.1 不一致
    - name: Verify Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "::error::gradlew file missing! Please commit the Gradle wrapper to the repository."
          exit 1
        fi

        chmod +x gradlew
        echo "Gradle Wrapper version:"
        ./gradlew --version

    # 改动 2：构建命令
    #   - 去掉 --info：CI 下日志量爆炸，GitHub 会截断，导致看不到真正的错误
    #   - 加上 --no-daemon：CI 环境是一次性的，Daemon 没有复用收益，反而增加
    #     内存占用和启动失败风险
    #   - 保留 --stacktrace：能看到真正的异常堆栈
    - name: Build with Gradle
      run: |
        touch build.log
        ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log
        echo "BUILD_LOG=build.log" >> $GITHUB_ENV

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: BlockServerCMD
        path: build/libs/*.jar
        retention-days: 7

    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: ${{ env.BUILD_LOG }}

    # 改动 3：诊断步骤也加上 --no-daemon，
    # 避免它去启动一个已经失败的 Daemon 而卡住或再次报错
    - name: Failure Diagnostics
      if: failure()
      run: |
        echo "===== FINAL DIAGNOSTICS ====="
        echo "Java: $(java -version 2>&1)"
        echo "Gradle:"
        ./gradlew --version --no-daemon || true
        echo "Log content:"
        cat build.log || echo "No log file"
