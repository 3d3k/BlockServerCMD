name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Pre-Build Checks
      run: |
        echo "===== Essential Files Check ====="
        echo "Workspace: $(pwd)"
        echo "--- Directory Listing ---"
        ls -la
        echo "--- Build Files ---"
        ls -l build.gradle* settings.gradle* || echo "No build files found"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 用官方 action 安装指定版本的 Gradle，不需要仓库里有 gradlew
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.7.1

    # 直接用 gradle 命令，不再用 ./gradlew
    # set -o pipefail：让管道中 gradle 失败时整体返回失败码，避免 tee 掩盖错误
    # 去掉 --info 避免日志被 GitHub 截断
    # 加 --no-daemon，CI 环境不需要守护进程
    - name: Build with Gradle
      run: |
        set -o pipefail
        touch build.log
        gradle build --stacktrace --no-daemon 2>&1 | tee build.log
        echo "BUILD_LOG=build.log" >> $GITHUB_ENV

    # 诊断：看看 build/ 里到底产出了什么
    - name: List build outputs
      if: always()
      run: |
        echo "===== .jar files under build/ ====="
        find build -type f -name "*.jar" 2>/dev/null || echo "No .jar files found"
        echo "===== build/libs/ listing ====="
        ls -l build/libs/ 2>/dev/null || echo "build/libs/ not found"
        echo "===== build/ top-level ====="
        ls -l build/ 2>/dev/null || echo "build/ not found"

    # 构建成功时上传 jar 产物
    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: BlockServerCMD
        path: build/libs/*.jar
        retention-days: 7

    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: ${{ env.BUILD_LOG }}

    - name: Failure Diagnostics
      if: failure()
      run: |
        echo "===== FINAL DIAGNOSTICS ====="
        echo "Java: $(java -version 2>&1)"
        echo "Gradle:"
        gradle --version --no-daemon || true
        echo "Log content:"
        cat build.log || echo "No log file"
